server {
    listen 127.0.0.1:3021;
    server_name rep.mattjhagen.xyz;
    root /opt/rep-onboarding/current;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data:; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; form-action 'self'" always;
    location ^~ /auth/ {
        access_log off;
        proxy_pass http://127.0.0.1:3023;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3023;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
    location = /healthz { default_type text/plain; return 200 "ok\n"; }
    location / { try_files $uri $uri/ =404; }
}
